<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CardioSurf — Legal</title>
  <style>
    :root { --bg:#0f1524; --card:#161d30; --text:#e7ecf5; --muted:#a4afc4; --accent:#4aa8ff; --border:#26304a; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.6; }
    .wrap { max-width:640px; margin:0 auto; padding:64px 20px; }
    h1 { font-size:1.8rem; margin:0 0 8px; letter-spacing:-0.02em; }
    p.muted { color:var(--muted); margin:0 0 28px; }
    a.card { display:block; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin:12px 0; color:var(--text); text-decoration:none; }
    a.card:hover { border-color:var(--accent); }
    a.card strong { color:var(--accent); }
    footer { color:var(--muted); font-size:0.9rem; margin-top:32px; }
    @media (prefers-color-scheme: light) { :root { --bg:#f6f8fc; --card:#fff; --text:#141a26; --muted:#556077; --accent:#0a66d0; --border:#e2e8f2; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CardioSurf</h1>
    <p class="muted">Legal documents</p>
    <a class="card" href="./privacy.html"><strong>Privacy Policy &rarr;</strong></a>
    <a class="card" href="./terms.html"><strong>Terms of Use (EULA) &rarr;</strong></a>
    <footer>&copy; 2026 CardioSurf.</footer>
  </div>
</body>
</html>
